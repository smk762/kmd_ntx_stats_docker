services:
  db:
    container_name: db
    image: postgres
    restart: always
    shm_size: '2gb'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "7654:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    
  web:
    container_name: web
    build: 
      context: .
      shm_size: '2gb'
      args:
        requirements: requirements/dev.txt
    environment:
      - DJANGO_SETTINGS_MODULE=kmd_ntx_stats.settings.dev
    command: bash -c "python manage.py runserver 0.0.0.0:8762"
    restart: always
    volumes:
      - ./code:/code
      - /var/www/stats.kmd.io/html/static:/var/www/stats.kmd.io/html/static
    ports:
      - "8762:8762"
    depends_on:
      - memcached
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  memcached:
    container_name: memcached
    image: memcached:latest
    ports:
      - "127.0.0.1:11211:11211"
    restart: always
    depends_on:
      - db
    command: ["memcached", "-I", "40m", "-m", "100m"]
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.18.1.1/16
